version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orangehrm-app
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ${SOURCE_DIR}:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/web
    depends_on:
      db:
        condition: service_healthy
    networks:
      - orangehrm-net
    restart: unless-stopped

  db:
    image: mariadb:10.6
    container_name: orangehrm-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-orangehrm_root}
      MYSQL_DATABASE: ${DB_NAME:-orangehrm}
    volumes:
      - orangehrm-db-data:/var/lib/mysql
    networks:
      - orangehrm-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  orangehrm-db-data:

networks:
  orangehrm-net:
    driver: bridge
